name: Air alert

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: air-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the air
        run: node scripts/air-alert.mjs
      - name: Save alert state
        run: |
          if [ -n "$(git status --porcelain alert-state.json)" ]; then
            git config user.name "air-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git add alert-state.json
            git commit -m "Update air alert state [skip ci]"
            git push
          fi
